
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Feedback</title>
</head>
<body style="margin:0; padding:30px 15px; background:#f4f6f8; font-family:Arial,Helvetica,sans-serif; color:#1f2937;">

    <div style="max-width:550px; margin:auto; background:#ffffff; border-radius:12px; overflow:hidden;">

        <div style="background:#2563eb; padding:25px; text-align:center;">
            <h1 style="margin:0; color:white; font-size:24px;">Tela33amek</h1>
            <p style="margin:8px 0 0; color:#dbeafe; font-size:14px;">
                New User Feedback
            </p>
        </div>

        <div style="padding:30px;">

            <h2 style="margin-top:0; font-size:20px;">You've received new feedback!</h2>

            <p style="font-size:14px; color:#6b7280; line-height:1.6;">
                A user has submitted feedback about Tela33amek.
            </p>

            <div style="margin:25px 0; padding:20px; background:#eff6ff; border-radius:10px; text-align:center;">
                <p style="margin:0 0 10px; font-size:13px; color:#6b7280;">
                    User rating
                </p>

                <p style="margin:0; font-size:30px; font-weight:bold; color:#2563eb;">
                    {{ rating }} / 5
                </p>
            </div>

            <h3 style="font-size:15px;">User's description</h3>

            <div style="padding:18px; background:#f9fafb; border-radius:8px; font-size:14px; line-height:1.7; color:#4b5563; white-space:pre-wrap; overflow-wrap:anywhere;">{{ description }}</div>

        </div>

        <div style="padding:20px; background:#f9fafb; text-align:center;">
            <p style="margin:0; font-size:12px; color:#9ca3af;">
                Tela33amek — Sharing knowledge, one paper at a time.
            </p>
        </div>

    </div>
</body>
</html>
