{% load static %}
<div class="filesection" data-type="{{ paper.paper_type }}">

    <div>
        <img class="image" src="{% static 'icons/doc.png' %}">
        <button
            type="button"
            class="papertype pdf-toggle" data-pdf-toggle="{{ paper.id }}"
            aria-expanded="false" aria-controls="pdf-viewer-{{ paper.id }}">
            {{ paper.year }} - {{ paper.major }}
            <span class="type-badge type-{{ paper.paper_type }}">
                {{ paper.get_paper_type_display }}
            </span>
        </button>
    </div>

    <div class="metadata">
        <p>Semester: {{ paper.semester }}</p>
        <p data-field="est">Est: {{ paper.establishment }}</p>
        <p data-field="teacher">Prof: {{ paper.teacher }}</p>
        <p>Cycle: {{ paper.cycle }}</p>
    </div>

    <button class="report-button" onclick="document.getElementById('report-{{ paper.id }}').showModal()">
        <img style="height:22px; padding-right:6px; filter:invert(100%);" src="{% static 'icons/warning.png' %}">
        Report!
    </button>

    <dialog id="report-{{ paper.id }}">
        <form method="POST" action="{% url 'report' paper.id %}">
            {% csrf_token %}
            <div class="report-head">
                <p class="report-eyebrow">Flag an issue</p>
                <h1>Report the paper</h1>
            </div>

            <div class="report-body">
                <fieldset>
                    <legend>What's wrong with it?</legend>
                    <div class="issue-grid">
                        <label><input type="checkbox" name="issue" value="wrong-year"> Wrong year</label>
                        <label><input type="checkbox" name="issue" value="wrong-major"> Wrong major</label>
                        <label><input type="checkbox" name="issue" value="duplicate"> Already uploaded</label>
                        <label><input type="checkbox" name="issue" value="not-exam"> Not an exam paper</label>
                        <label><input type="checkbox" name="issue" value="wrong-subject"> Wrong subject</label>
                        <label><input type="checkbox" name="issue" value="poor-scan"> Unreadable scan</label>
                    </div>
                </fieldset>

                <label class="desc-label" for="report-desc-{{ paper.id }}">Tell us more</label>
                <textarea name="description" id="report-desc-{{ paper.id }}" placeholder="Add any details that will help us review this paper faster…"></textarea>

                <div class="report-actions">
                    <button class="btn btn-ghost" type="button" onclick="document.getElementById('report-{{ paper.id }}').close()">Cancel</button>
                    <button id="reportButton" class="btn btn-submit" type="submit">Submit report</button>
                </div>
            </div>
        </form>
    </dialog>

</div>

<div
    id="pdf-viewer-{{ paper.id }}"
    class="inline-pdf-viewer"
    data-pdf-url="{% url 'view_pdf' paper.id %}"
    hidden
>
    <div class="pdf-toolbar">
        <span class="pdf-page-info">
            Page <span data-current-page>1</span>
            / <span data-page-count>—</span>
        </span>

        <div class="pdf-controls">
            <button type="button" data-prev disabled>←</button>
            <button type="button" data-next disabled>→</button>
            <button type="button" data-zoom-out>−</button>
            <span data-zoom-level>150%</span>
            <button type="button" data-zoom-in>+</button>

            <button type="button" data-fullscreen>
                Fullscreen
            </button>

            <a
                href="{% url 'view_pdf' paper.id %}"
                download
                class="pdf-download"
            >
                Download
            </a>

            <button type="button" data-close>
                Close
            </button>
        </div>
    </div>

    <p data-pdf-status role="status" aria-live="polite">
        Loading PDF…
    </p>

    <div class="pdf-page-container">
        <canvas data-pdf-canvas></canvas>
    </div>
</div>
